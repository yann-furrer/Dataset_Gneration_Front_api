version: 1.0
runtime-version: 3.11
build:
    - pip3 install pipenv
    - pipenv requirements > requirements.txt
    - pip3 install -r requirements.txt
pre-run:
    - pip3 install pipenv
    - pipenv install --deploy --ignore-pipfile
run: 
  command: pipenv run python3 main.py
  network:
    port: 8000
