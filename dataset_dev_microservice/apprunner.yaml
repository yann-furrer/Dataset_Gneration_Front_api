version: 1.0
runtime: python311
build:
  commands:
   
    build:        
      - pip3 install pipenv
      - pipenv install
   
run:
  runtime-version: 3.11
  pre-run:  
    - pip3 install pipenv
    - pipenv install
  command: pipenv run uvicorn main:app --host 0.0.0.0 --port 8080
  network: 
    port: 8080
  