version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -r requirements.txt
run:
  pre-run:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  runtime-version: 3.11
  command: python main.py
  network:
    port: 8000
    env: PORT