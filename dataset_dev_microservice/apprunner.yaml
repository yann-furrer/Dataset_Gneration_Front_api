version: 1.0
runtime: python311
run:
  runtime-version: 3.11
  pre-run:
    - echo "=== Installation de toutes les dépendances ==="
    - pip3 install --upgrade pip
    - pip3 install -r requirements.txt  # Toutes vos dépendances (incluant boto3)
    - echo "=== Vérification des installations ==="
    - python3 -c "import boto3; print('boto3 OK')"
    - python3 -c "import fastapi; print('FastAPI OK')"
    - python3 -c "import uvicorn; print('Uvicorn OK')"
  command: python3 -m uvicorn main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000

