version: 1.0
runtime: python311
build:
  commands:
    build:        
      - pip3 install pipenv
run:
  runtime-version: 3.11
  pre-run:  
    - pip3 install pipenv
    - pipenv install --system
  command: python3 main.py
  network: 
    port: 8000
  env:
    - name: PORT
      value: "8000"
